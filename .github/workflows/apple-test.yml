name: Publish verified Mac 1.1.98 packages
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mac-1.1.98-asset-upload
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and upload previously tested Mac packages
        run: python3 scripts/publish-mac1198.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mac-1.1.98-publication-verification
          path: .cache/mac1198-upload/reports/
          retention-days: 30
