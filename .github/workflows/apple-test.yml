name: macOS builds
on:
  push:
    branches: ['codex/apple-test-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node -e "if(process.arch !== '${{ matrix.arch }}') throw Error(process.arch)"
      - run: npm run dist:mac
      - name: Exercise packaged native reader
        run: |
          APP=$(find release -path '*/OmiComic.app/Contents/MacOS/OmiComic' -type f -print -quit)
          OMICOMIC_PACKAGED_EXE="$PWD/$APP" node --test tests/apple-desktop.electron.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmiComic-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            test-results/apple-desktop/*.png
            test-results/apple-desktop/result.json
          retention-days: 30
