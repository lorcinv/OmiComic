name: OmiComic
options:
  deploymentTarget:
    iOS: "16.4"
packages:
  SwiftArchive:
    url: https://github.com/matteo-pacini/libarchive-for-swift
    revision: e8b70b7f0e15108a828362fe696e63898d5be916
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: io.github.lorcinv.omicomic.ios
    MARKETING_VERSION: "1.1.96"
    CURRENT_PROJECT_VERSION: "1196"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  OmiComic:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../dist-ios
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
      - path: Licenses
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: OmiComic
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: YES
        LSSupportsOpeningDocumentsInPlace: YES
        CFBundleDocumentTypes:
          - CFBundleTypeName: Comics and books
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image, public.zip-archive, com.rarlab.rar-archive, org.7-zip.7-zip-archive, com.adobe.pdf, org.idpf.epub-container, public.data]
    dependencies:
      - package: SwiftArchive
        product: libarchive
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  OmiComicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: TestFixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lorcinv.omicomic.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        # Xcode 16.4 / iOS 18.5 has a missing Swift WebKit overlay for older test targets.
        # Keep the app at iOS 16; only the hosted test bundle needs Apple's workaround.
        # https://developer.apple.com/forums/thread/785964
        IPHONEOS_DEPLOYMENT_TARGET: "18.4"
    dependencies:
      - target: OmiComic
schemes:
  OmiComic:
    build:
      targets:
        OmiComic: all
        OmiComicTests: [test]
    test:
      targets: [OmiComicTests]
